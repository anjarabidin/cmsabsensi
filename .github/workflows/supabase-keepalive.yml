name: Supabase Keep-Alive

on:
  schedule:
    # Run every 3 days at 00:00 UTC to prevent project pausing
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -f -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/app_settings?select=key&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
        # Note: If app_settings table doesn't have RLS for anon users, this might need a public table
        # Or you can just hit the health check if available.
        # This will count as API activity and keep the project alive.
